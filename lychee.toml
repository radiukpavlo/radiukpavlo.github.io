# Link check for the built site and the bibliography (see .github/workflows/links.yml).
max_concurrency = 4
max_retries = 2
retry_wait_time = 5
timeout = 30

# Publishers such as MDPI answer automated clients with 403 or 429; treat those as reachable.
accept = ["200..=299", "403", "429"]

exclude_path = ["dist/_astro"]
exclude = ["^https://radiukpavlo\\.goatcounter\\.com", "^https://gc\\.zgo\\.at"]
