- id: uav-green-energy-defects
  title: Intelligent System for Recognising Defects of Green-Energy Objects Using UAVs
  funder: Ministry of Education and Science of Ukraine
  programme: State-funded research and development
  grantId: 0124U004665
  role: Researcher (executor)
  start: '2024-09-01'
  end: '2026-08-31'
  status: completed
  euFunded: false
  summary: >-
    A national project led by West Ukrainian National University with the participation of
    Khmelnytskyi National University. It develops methods for collecting, recognising and
